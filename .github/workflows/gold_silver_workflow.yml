name: Nippon ETF Positional Trading & Backtest Engine

on:
  workflow_dispatch:
    inputs:
      backtest_mode:
        description: 'क्या बैकटेस्ट चलाना चाहते हैं? (true / false)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      start_date:
        description: 'Backtest Start Date (YYYY-MM-DD)'
        required: false
        default: '2025-01-01'
      end_date:
        description: 'Backtest End Date (YYYY-MM-DD)'
        required: false
        default: '2026-08-24'
  schedule:
    - cron: '30 3 * * 1-5'  # सोमवार से शुक्रवार भारतीय समयानुसार सुबह 9:00 बजे स्व-संचालित

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Execute Positional Engine
        env:
          INPUT_BACKTEST: ${{ inputs.backtest_mode }}
          INPUT_START_DATE: ${{ inputs.start_date }}
          INPUT_END_DATE: ${{ inputs.end_date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/gold_silver_engine.py
