name: AI Bullion Wealth Engine

on:
  schedule:
    # सोमवार से शुक्रवार दोपहर 1:45 PM IST (8:15 AM UTC) पर ऑटोमैटिक चलेगा
    - cron: '15 8 * * 1-5'
  workflow_dispatch: # मैनुअल रन करने के लिए बटन

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Code Download Kar Raha Hai
        uses: actions/checkout@v3

      - name: Python Setup Kar Raha Hai
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Libraries Install Kar Raha Hai
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Engine Run Kar Raha Hai
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/gold_silver_engine.py
