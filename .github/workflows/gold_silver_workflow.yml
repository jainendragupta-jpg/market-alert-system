name: Institutional Nippon Gold & Silver ETF Engine

on:
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Single Test Date (YYYY-MM-DD)'
        required: true
        default: '2026-08-24'
  schedule:
    - cron: '30 3 * * 1-5'  # Monday to Friday 9:00 AM IST Automatic Live Scan

jobs:
  run-etf-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Required Libraries
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Run Institutional Engine
        env:
          INPUT_TEST_DATE: ${{ inputs.test_date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python etf_engine.py
